<body class="min-h-screen flex flex-col selection:bg-[#009688] selection:text-white">
<header class="sticky top-0 z-30 bg-[#f3f5f7]/95 backdrop-blur-sm border-b border-slate-200/80">
  <div class="max-w-[1220px] mx-auto px-4 sm:px-8 h-16 flex items-center justify-between gap-3">
    <div class="flex items-center gap-3 sm:gap-5">
      <div class="flex items-center gap-1 text-sm text-slate-600">
        <button id="prev" class="p-1.5 text-[#009688] hover:bg-slate-200/70 rounded transition disabled:opacity-30" title="Questão anterior (←)"><i data-lucide="chevron-left" class="w-5 h-5 stroke-[2.5]"></i></button>
        <span class="text-slate-600 text-[13px]">Pág.</span>
        <span id="current" class="w-12 h-9 flex items-center justify-center bg-white border border-slate-300 rounded-[4px] text-sm font-medium text-slate-800">1</span>
        <span class="text-slate-600 text-[13px]">de <span id="total">0</span></span>
        <button id="next" class="p-1.5 text-[#009688] hover:bg-slate-200/70 rounded transition disabled:opacity-30" title="Próxima questão (→)"><i data-lucide="chevron-right" class="w-5 h-5 stroke-[2.5]"></i></button>
      </div>
    </div>
    <div class="flex items-center gap-2">
      <button id="modeBtn" class="inline-flex items-center gap-2 px-3.5 py-2 rounded-[5px] border border-slate-300 bg-white hover:bg-slate-50 text-slate-700 text-sm font-medium transition" title="Iniciar modo simulado"></button>
      <button id="themeBtn" class="inline-flex items-center gap-2 px-3 py-2 rounded-[5px] border border-slate-300 bg-white hover:bg-slate-50 text-slate-700 text-sm font-medium transition" title="Modo escuro"></button>
      <button id="mapBtn" class="inline-flex items-center gap-2 px-3.5 py-2 rounded-[5px] border border-slate-300 bg-white hover:bg-slate-50 text-slate-700 text-sm font-medium transition" title="Abrir mapa de questões">
        <i data-lucide="layout-grid" class="w-4 h-4 text-[#009688]"></i><span class="hidden sm:inline">Mapa</span>
      </button>
      <button id="importBtn" class="inline-flex items-center gap-2 px-3.5 py-2 rounded-[5px] border border-slate-300 bg-white hover:bg-slate-50 text-slate-700 text-sm font-medium transition" title="Importar questões de PDF">
        <i data-lucide="file-up" class="w-4 h-4 text-[#009688]"></i><span class="hidden sm:inline">Importar PDF</span>
      </button>
    </div>
  </div>
</header>
<main class="w-full max-w-[1000px] mx-auto px-4 sm:px-8 py-7 sm:py-10 flex-1"><div id="app"></div></main>

<!-- Mapa lateral de questões -->
<div id="mapOverlay" class="fixed inset-0 bg-slate-900/20 z-40 hidden"></div>
<aside id="questionMap" class="fixed top-0 right-0 h-screen w-[310px] max-w-[88vw] bg-white border-l border-slate-200 shadow-[-8px_0_30px_rgba(15,23,42,.08)] z-50 translate-x-full transition-transform duration-200 flex flex-col">
  <div class="px-5 py-4 border-b border-slate-200 flex items-center justify-between gap-3">
    <div>
      <div class="font-bold text-slate-700">Mapa de questões</div>
      <div id="mapSummary" class="text-[11px] text-slate-400 mt-0.5">0 questões</div>
    </div>
    <button id="closeMap" class="p-1.5 rounded hover:bg-slate-100 text-slate-500" title="Fechar mapa"><i data-lucide="x" class="w-5 h-5"></i></button>
  </div>
  <div class="px-5 py-4 border-b border-slate-100">
    <div class="relative">
      <i data-lucide="search" class="w-4 h-4 text-slate-400 absolute left-3 top-1/2 -translate-y-1/2"></i>
      <input id="jumpInput" type="number" min="1" placeholder="Ir para questão..." class="w-full h-10 pl-9 pr-3 rounded-[5px] border border-slate-300 text-sm text-slate-700 outline-none focus:border-[#009688] focus:ring-1 focus:ring-[#009688]/20">
    </div>
  </div>
  <div class="px-5 py-3 border-b border-slate-100 flex flex-wrap gap-x-4 gap-y-2 text-[11px] text-slate-500">
    <span class="inline-flex items-center gap-1.5"><i class="w-2.5 h-2.5 rounded-full bg-slate-200 border border-slate-300"></i>Não feita</span>
    <span class="inline-flex items-center gap-1.5"><i class="w-2.5 h-2.5 rounded-full bg-emerald-500"></i>Acertou</span>
    <span class="inline-flex items-center gap-1.5"><i class="w-2.5 h-2.5 rounded-full bg-rose-500"></i>Errou</span>
  </div>
  <div id="questionGrid" class="flex-1 overflow-y-auto p-5 content-start grid grid-cols-5 gap-2"></div>
  <div class="px-5 py-4 border-t border-slate-100 text-[11px] text-slate-400">Clique em qualquer número para ir direto à questão.</div>
</aside>

<!-- botão flutuante quando o mapa estiver fechado -->
<button id="mapFloating" class="fixed right-4 bottom-5 z-40 hidden items-center gap-2 px-3.5 py-2.5 rounded-full bg-[#009688] hover:bg-[#00796b] text-white text-xs font-semibold shadow-lg transition" title="Abrir mapa">
  <i data-lucide="layout-grid" class="w-4 h-4"></i><span>Mapa</span>
</button>

<!-- Criar simulado -->
<div class="modal" id="simModal">
  <div class="bg-white rounded-[8px] shadow-xl w-full max-w-[620px] overflow-hidden">
    <div class="px-5 sm:px-6 py-4 border-b border-slate-200 flex items-center justify-between">
      <div><h2 class="font-bold text-slate-700">Criar simulado</h2><p class="text-xs text-slate-500 mt-1">Monte um simulado usando as questões disponíveis.</p></div>
      <button id="closeSim" type="button" class="p-1.5 rounded hover:bg-slate-100 text-slate-500" title="Fechar"><i data-lucide="x" class="w-5 h-5"></i></button>
    </div>
    <div class="p-5 sm:p-6 space-y-5">
      <div class="grid grid-cols-2 gap-2">
        <button id="simRandomMode" type="button" class="sim-choice flex items-center gap-2 p-3 rounded-[6px] border border-[#009688] bg-[#e0f2f1] text-left"><i data-lucide="shuffle" class="w-4 h-4 text-[#00897b]"></i><span><b class="block text-sm text-slate-700">Questões aleatórias</b><span class="text-[11px] text-slate-500">Escolha a quantidade</span></span></button>
        <button id="simSpecificMode" type="button" class="sim-choice flex items-center gap-2 p-3 rounded-[6px] border border-slate-300 bg-white text-left"><i data-lucide="list-ordered" class="w-4 h-4 text-[#00897b]"></i><span><b class="block text-sm text-slate-700">Escolher números</b><span class="text-[11px] text-slate-500">Informe as questões</span></span></button>
      </div>
      <div id="simRandomPanel" class="space-y-3"><label class="block text-sm font-semibold text-slate-700">Quantidade de questões<input id="simCount" type="number" min="1" class="mt-1.5 w-full h-10 px-3 rounded-[5px] border border-slate-300 outline-none focus:border-[#009688] focus:ring-1 focus:ring-[#009688]/20" placeholder="Ex.: 20"></label></div>
      <div id="simSpecificPanel" class="hidden space-y-3"><label class="block text-sm font-semibold text-slate-700">Números das questões<input id="simNumbers" type="text" class="mt-1.5 w-full h-10 px-3 rounded-[5px] border border-slate-300 outline-none focus:border-[#009688] focus:ring-1 focus:ring-[#009688]/20" placeholder="Ex.: 1, 5, 8, 12-15"></label><p class="text-[11px] text-slate-500">Use números separados por vírgula e intervalos, como <b>10-15</b>.</p></div>
      <label class="block text-sm font-semibold text-slate-700">Excluir números específicos<input id="simExclude" type="text" class="mt-1.5 w-full h-10 px-3 rounded-[5px] border border-slate-300 outline-none focus:border-[#009688] focus:ring-1 focus:ring-[#009688]/20" placeholder="Opcional: 2, 7, 18-20"></label>
      <p id="simAvailable" class="text-xs text-slate-500"></p><div id="simError" class="hidden text-sm text-rose-600 bg-rose-50 border border-rose-200 rounded-[5px] px-3 py-2"></div>
      <div class="flex justify-end gap-2 pt-1"><button id="cancelSim" type="button" class="px-4 py-2.5 rounded-[5px] border border-slate-300 text-slate-600 hover:bg-slate-50 text-sm font-semibold">Cancelar</button><button id="createSim" type="button" class="px-4 py-2.5 rounded-[5px] bg-[#009688] hover:bg-[#00796b] text-white text-sm font-semibold">Criar simulado</button></div>
    </div>
  </div>
</div>

<div class="modal" id="importModal">
  <div class="bg-white rounded-[8px] shadow-xl w-full max-w-[680px] overflow-hidden">
    <div class="px-5 sm:px-6 py-4 border-b border-slate-200 flex items-center justify-between">
      <h2 class="font-bold text-slate-700">Importar questões</h2>
      <button id="closeImport" class="p-1.5 rounded hover:bg-slate-100 text-slate-500" title="Fechar"><i data-lucide="x" class="w-5 h-5"></i></button>
    </div>
    <div class="p-5 sm:p-6">
      <label id="dropZone" class="block border-2 border-dashed border-slate-300 hover:border-[#009688] rounded-[8px] p-8 text-center cursor-pointer transition">
        <i data-lucide="file-up" class="w-8 h-8 mx-auto mb-3 text-[#009688]"></i>
        <div class="font-semibold text-slate-700">Arraste o PDF para cá ou clique para selecionar</div>
        <div class="text-xs text-slate-500 mt-1">O arquivo será processado para montar as questões.</div>
        <input type="file" id="pdfInput" accept="application/pdf" class="hidden">
      </label>
      <div id="progress" class="mt-3 text-xs text-slate-500"></div>
    </div>
  </div>
</div>
<script>
const mapEl=document.getElementById('questionMap');
const mapOverlay=document.getElementById('mapOverlay');
const mapFloating=document.getElementById('mapFloating');
function openMap(){ mapEl.classList.remove('translate-x-full'); mapOverlay.classList.remove('hidden'); mapFloating.classList.add('hidden'); renderMap(); }
function closeMap(){ mapEl.classList.add('translate-x-full'); mapOverlay.classList.add('hidden'); mapFloating.classList.remove('hidden'); }
const rev=q=>state.mode==='simulado'?!!state.simDone:!!q.answered; // gabarito/resolução visíveis?
function isQuestionCorrect(q){ return !!(q && rev(q) && q.correta && q.selected===q.correta); }
function isQuestionWrong(q){ return !!(q && rev(q) && q.correta && q.selected && q.selected!==q.correta); }
function renderMap(){
  const grid=document.getElementById('questionGrid'); if(!grid)return;
  const total=state.questions.length;
  const sim=state.mode==='simulado',done=state.questions.filter(q=>sim?q.selected:q.answered).length;
  const right=state.questions.filter(isQuestionCorrect).length;
  const wrong=state.questions.filter(isQuestionWrong).length;
  document.getElementById('mapSummary').textContent=sim&&!state.simDone?`${total} questões · ${done} respondidas (simulado)`:`${total} questões · ${done} feitas · ${right} certas · ${wrong} erradas`;
  grid.innerHTML=state.questions.map((q,i)=>{
    const current=i===state.current, correct=isQuestionCorrect(q), wrong=isQuestionWrong(q);
    const cls=correct?'bg-emerald-500 border-emerald-500 text-white hover:bg-emerald-600':wrong?'bg-rose-500 border-rose-500 text-white hover:bg-rose-600':current?'bg-[#009688] border-[#009688] text-white':(sim&&!state.simDone&&q.selected)?'bg-[#b2dfdb] border-[#80cbc4] text-[#00695c]':'bg-white border-slate-300 text-slate-600 hover:border-[#009688] hover:text-[#00796b]';
    return `<button type="button" onclick="jumpToQuestion(${i})" title="Questão ${esc(String(q.numero||i+1))}${correct?' — acertou':wrong?' — errou':''}" class="h-10 rounded-[5px] border text-xs font-semibold transition ${cls} ${current?'ring-2 ring-[#009688]/20':''}">${esc(String(q.numero||i+1))}</button>`;
  }).join('');
  if(window.lucide)lucide.createIcons();
}
function jumpToQuestion(index){
  if(!state.questions.length)return;
  state.current=Math.max(0,Math.min(state.questions.length-1,index)); save(); render(); renderMap();
}
function jumpFromInput(){
  const value=parseInt(document.getElementById('jumpInput').value,10);
  if(Number.isInteger(value) && value>=1 && value<=state.questions.length){ jumpToQuestion(value-1); document.getElementById('jumpInput').value=''; }
}

document.getElementById('mapBtn').onclick=openMap;
document.getElementById('closeMap').onclick=closeMap;
document.getElementById('mapFloating').onclick=openMap;
mapOverlay.onclick=closeMap;
document.getElementById('jumpInput').addEventListener('keydown',e=>{if(e.key==='Enter')jumpFromInput()});

document.addEventListener('keydown',e=>{if(e.key==='Escape' && !mapEl.classList.contains('translate-x-full'))closeMap()});

pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

const INITIAL_QUESTIONS=[{"id": 1, "numero": 1, "codigo": "4000165627", "instituicao": "SP - UNIVERSIDADE DE SÃO PAULO - USP (HOSPITAL DAS CLÍNICAS DA FACULDADE DE MEDICINA DA USP)", "ano": "2022", "enunciado": "Mulher, 45 anos de idade, é submetida a histerectomia total abdominal. Após a retirada do útero, o cirurgião sutura a cúpula vaginal através da aproximação da mucosa vaginal com pontos separados de poligalactina 00. Qual é o próximo tempo cirúrgico?", "alternativas": [{"letra": "A", "texto": "Sutura dos ligamentos útero-sacros à cúpula vaginal."}, {"letra": "B", "texto": "Fixação dos ligamentos pubo-vésico-cervicais à cúpula vaginal."}, {"letra": "C", "texto": "Fixação dos ligamentos redondos à cúpula vaginal."}, {"letra": "D", "texto": "Sutura do infundíbulo pélvico à cúpula vaginal."}], "correta": "A", "videoUrl": "https://www.youtube.com/watch?v=M7lc1UVf-VE", "selected": null, "answered": false, "eliminated": []}, {"id": 2, "numero": 2, "codigo": "4000158920", "instituicao": "SP - UNIVERSIDADE DE SÃO PAULO - USP (HOSPITAL DAS CLÍNICAS DA FACULDADE DE MEDICINA DA USP)", "ano": "2022", "enunciado": "Homem de 62 anos, hipertenso e tabagista, dá entrada no pronto-socorro com dor torácica retroesternal em aperto há 90 minutos, irradiada para membro superior esquerdo e associada a sudorese fria. PA: 84x52 mmHg, FC: 52 bpm, turgência jugular patológica a 45° e ausculta pulmonar limpa. O ECG revela supradesnivelamento do segmento ST em DII, DIII e aVF. Além da terapia de reperfusão, a conduta imediata correta é:", "alternativas": [{"letra": "A", "texto": "Administrar nitrato sublingual e morfina endovenosa para controle álgico imediato."}, {"letra": "B", "texto": "Solicitar derivações direitas (V3R e V4R) e iniciar expansão volêmica cuidadosa com cristaloide."}, {"letra": "C", "texto": "Iniciar furosemida endovenosa devido ao ingurgitamento jugular acentuado."}, {"letra": "D", "texto": "Iniciar metoprolol endovenoso para reduzir o consumo miocárdico de oxigênio."}], "correta": "B", "videoUrl": "https://www.youtube.com/watch?v=M7lc1UVf-VE", "selected": null, "answered": false, "eliminated": []}, {"id": 3, "numero": 3, "codigo": "4000140709", "instituicao": "SP - UNIVERSIDADE DE SÃO PAULO - USP (HOSPITAL DAS CLÍNICAS DA FACULDADE DE MEDICINA DA USP)", "ano": "2021", "enunciado": "Menina, 9 anos de idade, vem à consulta de rotina. O pai está preocupado pois recentemente notou uma nodulação na mama direita da filha. Relata que avó paterna faleceu de câncer de mama aos 49 anos. Ao exame clínico nota-se uma elevação da aréola e papila a direita, formando uma pequena saliência, com palpação fibroelástica. Sem alterações do lado esquerdo.\n\nSem outras alterações ao exame clínico. A conduta é:", "alternativas": [{"letra": "A", "texto": "Solicitar ultrassonografia de mama."}, {"letra": "B", "texto": "Solicitar prolactina, TSH e cortisol."}, {"letra": "C", "texto": "Manter conduta expectante."}, {"letra": "D", "texto": "Realizar punção aspirativa por agulha fina."}], "correta": "C", "videoUrl": "https://www.youtube.com/watch?v=M7lc1UVf-VE", "selected": null, "answered": false, "eliminated": []}];
let state={questions:INITIAL_QUESTIONS,current:0,mode:'estudo',simDone:false,showResults:false,questionBank:INITIAL_QUESTIONS};
const STORAGE='questoes_minimal_v1';

const scrub=s=>String(s||'').replace(/\[?[ \t]*LINK(?:_VIDEO)?[ \t]*:[ \t]*(?:https?:\/\/[^\s\]]*)?\]?/g,' ').replace(/[ \t]{2,}/g,' ').replace(/[ \t]+\n/g,'\n').trim();
function cleanQuestion(q,i){
  const bad=u=>/drivemedico/i.test(u||'');
  return {
    id:q.id||i+1, numero:q.numero||i+1, codigo:q.codigo||'', instituicao:q.instituicao||'',
    ano:q.ano||'', enunciado:scrub(q.enunciado),
    alternativas:(q.alternativas||[]).map(a=>({letra:a.letra,texto:scrub(a.texto),explicacao:scrub(a.explicacao)})),
    correta:q.correta||'', comentario:scrub(q.comentario), videoUrl:bad(q.videoUrl)?'':(q.videoUrl||''), allLinks:(q.allLinks||[]).filter(u=>!bad(u)), avisos:q.avisos||[],
    selected:q.selected||null, answered:!!q.answered, eliminated:q.eliminated||[]
  };
}
function save(){try{localStorage.setItem(STORAGE,JSON.stringify(state))}catch(e){console.warn('Não foi possível salvar o progresso',e)}}
function load(){

function copyPrompt(){
  const q=state.questions[state.current]; if(!q)return;
  const plain=s=>String(s||'').replace(/⟦IMG:[^⟧]+⟧/g,'[imagem omitida]').replace(/[ \t]+/g,' ').replace(/\n{3,}/g,'\n\n').trim();

  const outras=q.alternativas.filter(a=>a!==sel&&a!==cor).map(a=>'- '+fmt(a)).join('\n');

  if(sel&&cor&&sel!==cor) t+=`Escolhi a resposta: ${fmt(sel)}\nEssa resposta estava errada. A resposta correta é ${fmt(cor)}. As outras alternativas são:\n${outras}\nMe ajude a entender por que minha resposta estava errada.`;

function simStats(){const Q=state.questions;let ok=0,err=0,blank=0,nogab=0;Q.forEach(q=>{if(!q.selected)blank++;else if(!q.correta)nogab++;else if(q.selected===q.correta)ok++;else err++});const base=ok+err+blank;return{total:Q.length,ok,err,blank,nogab,base,pct:base?Math.round(ok/base*100):0}}

function parseNumberList(text){const out=new Set();String(text||'').split(',').map(x=>x.trim()).filter(Boolean).forEach(part=>{const m=part.match(/^(\d+)\s*-\s*(\d+)$/);if(m){let a=Number(m[1]),b=Number(m[2]);if(a>b)[a,b]=[b,a];for(let n=a;n<=b;n++)out.add(n)}else if(/^\d+$/.test(part))out.add(Number(part))});return out}

function createSim(){

  const pool=bank.filter(q=>!excluded.has(Number(q.numero)));

function selectOption(letter){
  const q=state.questions[state.current]; if(!q||rev(q))return;
  q.eliminated=(q.eliminated||[]).filter(x=>x!==letter);
  q.selected=q.selected===letter?null:letter; save(); render();
}
function eliminate(letter){
  const q=state.questions[state.current]; if(!q||rev(q))return;
  q.eliminated=q.eliminated||[];
  if(q.eliminated.includes(letter)) q.eliminated=q.eliminated.filter(x=>x!==letter);
  else {q.eliminated.push(letter);if(q.selected===letter)q.selected=null}
  save();render();
}
function answer(){const q=state.questions[state.current];if(!q?.selected||q.answered||state.mode==='simulado')return;q.answered=true;save();render()}

document.addEventListener('keydown',e=>{
  if(e.target.matches('input,textarea,select,[contenteditable=\"true\"]')||e.ctrlKey||e.metaKey||e.altKey)return;

  // Navegação rápida
  if(e.key==='ArrowLeft'){e.preventDefault();move(-1);return;}
  if(e.key==='ArrowRight'){e.preventDefault();move(1);return;}

  // Teclas 1–5 selecionam A–E
  const numberToLetter={'1':'A','2':'B','3':'C','4':'D','5':'E'};
  if(numberToLetter[e.key]){
    e.preventDefault();
    selectOption(numberToLetter[e.key]);
    return;
  }

  // Também permite selecionar diretamente pelas letras A–E
  if(['a','b','c','d','e'].includes(e.key.toLowerCase())){
    e.preventDefault();
    selectOption(e.key.toUpperCase());
    return;
  }

  // 0 risca/desrisca a alternativa atualmente selecionada, sem apagá-la
  if(e.key==='0'){
    e.preventDefault();
    const q=state.questions[state.current];
    if(q?.selected && !rev(q)) eliminate(q.selected);
    return;
  }

  // Enter responde a questão
  if(e.key==='Enter'){
    e.preventDefault();
    answer();
  }

      if (!correta) av.push('Gabarito não encontrado no PDF para esta questão.');
      if (FIG_RE.test(stem) && !markerIds(stem).length) av.push('O enunciado/alternativas citam uma figura, imagem ou tabela que não foi encontrada no PDF (pode ser desenho vetorial). Confira no arquivo original.');
      if (FIG_RE.test(res) && !markerIds(res).length) av.push('A resolução cita uma figura, imagem ou tabela que não foi encontrada no PDF. Confira no arquivo original.');
      if (markerIds(stem + ' ' + res).some(id => !IMGS[id])) av.push('Há uma imagem nesta questão que não pôde ser extraída do PDF (marcada com ⚠ no texto). Confira no arquivo original.');
      return av;
    }

    function parseQuestionsLocally(rawText) {
      const text = String(rawText || '')
        .replace(/\r/g, '')
        .replace(/--- PÁGINA \d+ ---/g, '\n')
        .replace(/\u00a0/g, ' ')
        .replace(/^[ \t]*[▶►▷]?[ \t]*Assistir\s+(?:a\s+)?(?:resolu[çc][ãa]o\s+)?em\s+v[ií]deo[ \t]*$/gim, '')
        .replace(/^[ \t]*www\.\S+(?:[ \t]*\|.*)?$/gim, '')
        .replace(/(?<![\/\w.@-])www\.[\w.-]+\.[a-z]{2,}(?:\/[^\s\]]*)?[ \t]*\|?[ \t]*/gi, ' ')
        .replace(/\(\d{2}\)[ \t]*9?\d{4}[ \t]?-?[ \t]?\d{4}/g, '')
        .replace(/^[ \t]*\(\d{2}\)?[ \t]*$/gm, '');

      let sections = splitIntoSections(text);
      let qSection = sections.find(s => s.items.filter(it => findAltChain(it.body)).length >= Math.ceil(s.items.length / 2));

      // Se o PDF/texto perdeu todas as linhas "Questão N - ID ...",
      // tenta reconstruir as questões diretamente pelas cadeias A-B-C-D(-E).
      if (!qSection) {
        const recovered = splitWithoutQuestionHeaders(text);
        if (recovered.length) {
          sections = recovered;
          qSection = recovered[0];
          qSection.items = recovered.flatMap(s => s.items);
        }
      }

      let blocks = [];
      let commentMap = {};
      if (qSection) {
        // Resolução em seção separada (por número da questão)
        sections.filter(s => s !== qSection).forEach(s => {
          s.items.forEach(it => {
            commentMap[it.num] = (commentMap[it.num] ? commentMap[it.num] + '\n' : '') + it.body.trim();
          });
        });

        // Blocos sem alternativas dentro da lista de questões são listas internas do comentário: voltam para a questão anterior
        qSection.items.forEach(it => {
          if (findAltChain(it.body)) {
            blocks.push({ num: it.num, body: (it.id ? it.id + '\n' : '') + it.body });
          } else if (blocks.length) {
            blocks[blocks.length - 1].body += '\n' + it.body;
          }
        });
      } else {
        const fb = splitByCodes(text);
        if (!fb) return [];
        blocks = fb.blocks;
        commentMap = fb.commentMap;
      }

      const gabMap = parseGabaritoLines(text);
      const questions = [];

      blocks.forEach(b => {
        const parsed = parseQuestionBlock(dropGabaritoLists(b.body));
        if (!parsed) return;

        const extra = dropGabaritoLists(commentMap[b.num] || '');
        const links = extractLinkInfo(b.body + '\n' + extra);
        const comment = parseComment([parsed.commentRaw, extra].filter(Boolean).join('\n'), parsed.alternativas.map(a => a.letra));
        const correta = comment.correta || gabMap[b.num] || '';

        questions.push({
          id: questions.length + 1,
          numero: b.num,
          codigo: parsed.codigo,
          instituicao: parsed.instituicao || String(state.deckName || 'QUESTÕES').toUpperCase(),
          ano: parsed.ano,
          enunciado: parsed.enunciado,
          alternativas: parsed.alternativas.map(a => ({ ...a, explicacao: comment.expl[a.letra] || '' })),
          correta,
          comentario: comment.comentario,
          videoUrl: links.videoUrl,
          allLinks: links.allLinks,
          avisos: buildAvisos(parsed, comment, correta),
          selected: null,
          answered: false,
          eliminated: []
        });
      });

      return questions;
    }
    // @@PARSER_END

async function pageImages(page,vw,pnum){
  const found=[]; let ops;
  try{ops=await page.getOperatorList()}catch{return found}
  const O=pdfjsLib.OPS,st=[]; let ctm=[1,0,0,1,0,0],n=0;
  const mul=(a,b)=>[a[0]*b[0]+a[2]*b[1],a[1]*b[0]+a[3]*b[1],a[0]*b[2]+a[2]*b[3],a[1]*b[2]+a[3]*b[3],a[0]*b[4]+a[2]*b[5]+a[4],a[1]*b[4]+a[3]*b[5]+a[5]];
  for(let i=0;i<ops.fnArray.length;i++){
    const fn=ops.fnArray[i],a=ops.argsArray[i];
    if(fn===O.save)st.push(ctm);
    else if(fn===O.restore)ctm=st.pop()||[1,0,0,1,0,0];
    else if(fn===O.transform)ctm=mul(ctm,a);
    else if(fn===O.paintImageXObject||fn===O.paintInlineImageXObject){
      const w=Math.hypot(ctm[0],ctm[1]),h=Math.hypot(ctm[2],ctm[3]);
      if(w>vw*.9||w<25||h<12)continue; // ignora fundo/marca d'água de página inteira e ícones
      found.push({id:`p${pnum}i${++n}`,x:ctm[4],y:Math.max(ctm[5],ctm[5]+ctm[3]),ref:a[0],inline:fn===O.paintInlineImageXObject});
    }
  }
  return found;
}
async function imageToUrl(page,it){
  try{
    const im=it.inline?it.ref:await new Promise((ok,no)=>{const t=setTimeout(()=>no(new Error('timeout')),5000);(String(it.ref).startsWith('g_')?page.commonObjs:page.objs).get(it.ref,o=>{clearTimeout(t);ok(o)})});
    const w=im.width,h=im.height,sc=Math.min(1,1000/w),c=document.createElement('canvas');
    c.width=Math.round(w*sc);c.height=Math.round(h*sc);
    const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);
    if(im.bitmap)x.drawImage(im.bitmap,0,0,c.width,c.height);
    else{
      const t=document.createElement('canvas');t.width=w;t.height=h;const tx=t.getContext('2d'),d=tx.createImageData(w,h),o=d.data,p=im.data;
      if(p.length===w*h*4)o.set(p);
      else if(p.length===w*h*3)for(let i=0,j=0;i<p.length;i+=3,j+=4){o[j]=p[i];o[j+1]=p[i+1];o[j+2]=p[i+2];o[j+3]=255}
      else{const rb=(w+7)>>3;for(let yy=0;yy<h;yy++)for(let xx=0;xx<w;xx++){const v=(p[yy*rb+(xx>>3)]>>(7-(xx&7)))&1?255:0,j=(yy*w+xx)*4;o[j]=o[j+1]=o[j+2]=v;o[j+3]=255}}
      tx.putImageData(d,0,0);x.drawImage(t,0,0,c.width,c.height);
    }
    return c.toDataURL('image/jpeg',.9);
  }catch(e){console.warn('Imagem não extraída',it.id,e);return null}
}
async function processPdf(file){
  const progress=document.getElementById('progress'),oldImgs=IMGS; progress.textContent='Lendo PDF...';
  try{
    const buffer=await file.arrayBuffer(),pdf=await pdfjsLib.getDocument({data:buffer}).promise;
    const pages=[],newImgs={},allIds=[],failed=[];
    state.deckName=file.name.replace(/\.pdf$/i,'').replace(/_/g,' ').replace(/^Quest[õo]es\s*-\s*/i,'').trim();
    for(let p=1;p<=pdf.numPages;p++){
      progress.textContent=`Lendo página ${p} de ${pdf.numPages}...`;
      const page=await pdf.getPage(p),tc=await page.getTextContent(),anns=await page.getAnnotations(),vw=page.view[2]-page.view[0];
      // descarta texto girado (rodapé/telefone em marca d'água lateral), que se misturava às linhas das questões
      let items=tc.items.filter(x=>x.str?.trim()&&Math.abs(x.transform[1])<Math.abs(x.transform[0])*.5).map(x=>({str:x.str,x:x.transform[4],y:x.transform[5],w:x.width||0,fs:Math.max(Math.abs(x.transform[0]||0),Math.abs(x.transform[3]||0),1)}));
      const links=[],consumed=new Set();
      for(const it of await pageImages(page,vw,p)){
        allIds.push(it.id);const url=await imageToUrl(page,it);
        if(url)newImgs[it.id]=url;else failed.push(it.id);
        links.push({str:`\n⟦IMG:${it.id}⟧\n`,x:it.x,y:it.y,w:0});
      }
      for(const a of anns){
        const url=a.url||a.unsafeUrl;if(a.subtype!=='Link'||!url)continue;
        // ignora links do rodapé/marca d'água (margens da página, drivemedico), que antes viravam "link de vídeo" no meio do texto
        if(/drivemedico/i.test(url)||(a.rect&&(a.rect[0]<20||a.rect[2]>vw-20||a.rect[2]-a.rect[0]<30)))continue;
        const r=a.rect||[0,0,0,0],under=items.filter(it=>it.x>=r[0]-3&&it.x<=r[2]+3&&it.y>=r[1]-4&&it.y<=r[3]+2);
        const label=under.map(it=>it.str).join(' ');
        const isVideo=VIDEO_HOST_RE.test(url)||!label||/v[ií]deo|assistir|play/i.test(label);
        if(isVideo)under.forEach(it=>consumed.add(it));
        links.push({str:` [${isVideo?'LINK_VIDEO':'LINK'}: ${url}] `,x:r[0],y:under.length?under[0].y:(r[1]+r[3])/2-3,w:0});
      }
      items=items.filter(x=>!consumed.has(x)).concat(links).sort((a,b)=>b.y-a.y);
      const lines=[];
      for(const it of items){const last=lines[lines.length-1];if(last&&Math.abs(last.y-it.y)<=4)last.items.push(it);else lines.push({y:it.y,items:[it]})}
      const pageLines=lines.map((line)=>{
        line.items.sort((a,b)=>a.x-b.x);
        let out='',end=null,fs=0;
        for(const it of line.items){
          if(out&&!out.endsWith(' ')&&!it.str.startsWith(' ')){
            const gap=end===null?99:it.x-end;
            if(gap>.5)out+=' ';
          }
          out+=it.str;
          end=it.x+it.w;
          fs=Math.max(fs,it.fs||0);
        }
        return {text:out.trim(),y:line.y,x:line.items[0]?.x||0,fs:fs||10,isImage:out.includes('⟦IMG:')};
      }).filter(line=>line.text);

      // IMPORTANTE: não usamos uma média global da página. Um PDF como este tem
      // cabeçalhos, alternativas, resolução, listas e imagens com espaçamentos
      // diferentes. A média global fazia algumas questões perderem os parágrafos.
      //
      // Para cada quebra entre duas linhas, estimamos o espaçamento normal usando
      // as linhas próximas. Um parágrafo novo normalmente tem aproximadamente uma
      // linha vazia entre os blocos, portanto seu salto vertical é bem maior que o
      // espaçamento normal das linhas. A decisão é tomada localmente, questão a
      // questão, e não por um texto específico.
      const gapAt=(i)=>Math.abs(pageLines[i-1].y-pageLines[i].y);
      const localNormalGap=(i)=>{
        const vals=[];
        for(let k=Math.max(1,i-5);k<=Math.min(pageLines.length-1,i+5);k++){
          const d=gapAt(k);
          if(d>0.5 && d<40) vals.push(d);
        }
        if(!vals.length) return 12;
        vals.sort((a,b)=>a-b);
        // O menor agrupamento representa o espaçamento entre linhas; gaps de
        // parágrafo ficam normalmente no grupo maior.
        const base=vals[Math.floor(vals.length*0.35)];
        return Math.max(4,base);
      };

      const pageText=[];
      pageLines.forEach((line,i)=>{
        if(i){
          const prev=pageLines[i-1];
          const dy=gapAt(i);
          const base=localNormalGap(i);
          const fontBase=Math.max(6,Math.min(prev.fs||10,line.fs||10));
          const ratio=dy/Math.max(base,1);
          const fontRatio=dy/fontBase;
          const imageBoundary=prev.isImage||line.isImage;
          // 1.35x cobre a linha vazia usada pelo PDF para separar parágrafos,
          // mas não transforma a quebra normal de uma linha longa em parágrafo.
          const paragraph=!imageBoundary && (ratio>=1.35 || fontRatio>=1.55);
          if(paragraph) pageText.push('');
          if(imageBoundary && line.isImage && pageText.length && pageText.at(-1)!=='') pageText.push('');
        }
        pageText.push(line.text);
        if(line.isImage && pageLines[i+1] && pageText.at(-1)!=='') pageText.push('');
      });
      pages.push(pageText);
    }
    IMGS=newImgs;
    const parsed=parseQuestionsLocally(pages.flat().join('\n'));
    if(!parsed.length)throw new Error('Não foi possível identificar as questões.');
    const used=new Set();
    parsed.forEach(q=>markerIds([q.enunciado,q.comentario,...q.alternativas.flatMap(a=>[a.texto,a.explicacao])].join(' ')).forEach(i=>used.add(i)));
    const orphan=allIds.filter(i=>!used.has(i)&&newImgs[i]),pg=ids=>[...new Set(ids.map(i=>i.slice(1).split('i')[0]))].join(', ');
    const warns=[];
    if(failed.length)warns.push(`${failed.length} imagem(ns) não puderam ser extraídas (pág. ${pg(failed)}). Elas aparecem marcadas com ⚠ nas questões.`);
    if(orphan.length)warns.push(`${orphan.length} imagem(ns) não foram encaixadas em nenhuma questão (pág. ${pg(orphan)}). Confira no PDF original.`);
    const semGab=parsed.filter(q=>!q.correta).length; if(semGab)warns.push(`${semGab} questão(ões) sem gabarito identificado.`);
    state.questionBank=parsed.map(cleanQuestion);state.questions=state.questionBank.map(q=>({...q}));state.current=0;state.mode='estudo';state.simDone=false;state.showResults=false;updateModeBtn();save();saveImgs();render();
    const comRes=parsed.filter(q=>q.comentario||q.alternativas.some(a=>a.explicacao)).length;
    if(warns.length){progress.innerHTML=`<div class="text-slate-700 font-medium">${parsed.length} questões importadas (${comRes} com resolução comentada).</div>`+warns.map(w=>`<div class="mt-2 p-2 rounded bg-amber-50 border border-amber-300 text-amber-900">⚠ ${esc(w)}</div>`).join('')}
    else{progress.textContent='';document.getElementById('importModal').classList.remove('open')}
  }catch(e){IMGS=oldImgs;progress.textContent='Erro: '+e.message}
}
load();updateModeBtn();applyTheme(document.documentElement.classList.contains('dark')?'dark':'light',false);render();loadImgs(); if(window.lucide) lucide.createIcons();
</script>
